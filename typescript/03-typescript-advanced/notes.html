        const rulesData = {
            'strict': 'Active toutes les vérifications strictes. Garantit le plus haut niveau de sécurité de type possible.',
            'noUnusedLocals': 'Les variables locales non utilisées génèrent une erreur. Garde un code propre et évite d\'encombrer la mémoire.',
            'noUnusedParameters': 'Les paramètres de fonctions non utilisés génèrent une erreur. S\'assure que les signatures de fonctions sont précises.',
            'noFallthroughCasesInSwitch': 'Empêche l\'exécution de passer d\'un "case" à un autre sans un "break" ou "return" dans les structures switch.',
            'forceConsistentCasingInFileNames': 'Force le respect de la casse des noms de fichiers lors des imports pour éviter les problèmes entre Windows et Linux.'
        };

        let currentModuleId = 1;
        let chartInstance = null;

        function renderNavigation() {
            const navContainer = document.getElementById('nav-container');
            navContainer.innerHTML = '';
            
            appData.forEach(module => {
                const btn = document.createElement('button');
                btn.className = `nav-item w-full text-left px-6 py-3 font-medium focus:outline-none flex items-center ${currentModuleId === module.id ? 'nav-active' : 'text-slate-400'}`;
                btn.onclick = () => selectModule(module.id);
                btn.innerHTML = `<span class="w-6 text-center mr-3">${module.icon}</span> <span class="truncate">${module.title.substring(3)}</span>`;
                navContainer.appendChild(btn);
            });
            updateProgress();
        }

        function updateProgress() {
            const progress = ((currentModuleId) / appData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        function selectModule(id) {
            currentModuleId = id;
            renderNavigation();
            
            const mainContent = document.getElementById('main-content');
            const module = appData.find(m => m.id === id);
            
            mainContent.innerHTML = module.render();

            if (id === 4) {
                setTimeout(initChart, 50); 
            }
        }

        function showRuleDetails(ruleName) {
            const card = document.getElementById('rule-detail-card');
            const title = document.getElementById('rule-title');
            const desc = document.getElementById('rule-desc');
            
            card.classList.remove('hidden');
            card.classList.add('fade-in');
            
            title.textContent = `"${ruleName}": true`;
            desc.textContent = rulesData[ruleName];
        }

        function simulateEvent(fileType) {
            const resultDiv = document.getElementById('event-result');
            resultDiv.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-slate-200', 'text-slate-600', 'bg-sky-100', 'text-sky-800');
            
            if (fileType === '.env' || fileType === '.ts') {
                resultDiv.classList.add('bg-emerald-100', 'text-emerald-800');
                resultDiv.innerHTML = `✅ Modification détectée par <strong>Nodemon</strong> sur <code>${fileType}</code>. Exécution de <code>tsx</code> lancée !`;
            } else if (fileType === '.test.ts') {
                resultDiv.classList.add('bg-slate-200', 'text-slate-600');
                resultDiv.innerHTML = `🛑 Modification ignorée. La règle d'exclusion de Nodemon s'applique sur <code>.test.ts</code>.`;
            }
        }

        function initChart() {
            const ctx = document.getElementById('performanceChart');
            if (!ctx) return;

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['tsc + nodemon (Ancien)', 'tsx watch (Moderne)'],
                    datasets: [
                        {
                            label: 'Nombre de Processus',
                            data: [2, 1],
                            backgroundColor: '#94a3b8',
                            borderRadius: 6
                        },
                        {
                            label: 'Fichiers écrits sur Disque (I/O)',
                            data: [100, 0],
                            backgroundColor: '#38bdf8',
                            borderRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if(context.datasetIndex === 1 && context.raw === 100) return " Beaucoup (Dossier dist/)";
                                    if(context.datasetIndex === 1 && context.raw === 0) return " Aucun (En Mémoire)";
                                    return " " + context.raw;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { display: false },
                            grid: { display: false }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        renderNavigation();
        selectModule(currentModuleId);
    </script>
</body>
</html>
